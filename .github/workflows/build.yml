name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests & lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GLOWLED_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "GLOWLED_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::GLOWLED_KEYSTORE_BASE64 secret not set - APK will be signed with a throwaway debug key."
            echo "SIGNED=debug-key" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          GLOWLED_KEYSTORE_PASSWORD: ${{ secrets.GLOWLED_KEYSTORE_PASSWORD }}
          GLOWLED_KEY_ALIAS: ${{ secrets.GLOWLED_KEY_ALIAS }}
          GLOWLED_KEY_PASSWORD: ${{ secrets.GLOWLED_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/GlowLED-v${VERSION}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: GlowLED-apk
          path: dist/*

      # Publishes v<versionName> automatically when main is pushed (or the workflow is run by hand).
      # Re-running replaces the APK, e.g. after adding the signing secrets.
      - name: Publish GitHub release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Glow LED v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: CHANGELOG.md
          make_latest: true
          fail_on_unmatched_files: true
